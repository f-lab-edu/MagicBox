spring:
  application:
    name: auth-dev
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

logging:
  level:
    reactor.netty: INFO
    org.springframework.web: INFO
    org.springframework.data.redis: INFO