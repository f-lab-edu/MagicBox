syntax = "proto3";

package magicbox.creator.v1;

option java_package = "kr.magicbox.creator.grpc.creator";
option java_outer_classname = "CreatorServiceProto";
option java_multiple_files = true;

service CreatorService {
  rpc IsCreatorAndSubscriberSamePerson(IsCreatorAndSubscriberSamePersonRequest)
      returns (IsCreatorAndSubscriberSamePersonResponse);
}

message IsCreatorAndSubscriberSamePersonRequest {
  int64 creator_id = 1;
  int64 subscriber_id = 2;
}

message IsCreatorAndSubscriberSamePersonResponse {
  bool same_person = 1;
}
