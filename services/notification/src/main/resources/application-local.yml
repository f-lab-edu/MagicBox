spring:
  application:
    name: notification-local
  jackson:
    property-naming-strategy: SNAKE_CASE
  config:
    import:
      - file:services/notification/env/local.env[.properties]
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    listener:
      ack-mode: record
      missing-topics-fatal: false
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: "kr.magicbox.notification.adapter.in.kafka.event"
        spring.json.type.mapping: >
          user-signup:kr.magicbox.notification.adapter.in.kafka.event.UserSignupEvent,
          user-banned:kr.magicbox.notification.adapter.in.kafka.event.UserBannedEvent,
          user-unbanned:kr.magicbox.notification.adapter.in.kafka.event.UserUnbannedEvent,
          user-duplicate-logged-in:kr.magicbox.notification.adapter.in.kafka.event.UserDuplicateLoggedInEvent,
          creator-certification-approved:kr.magicbox.notification.adapter.in.kafka.event.CreatorCertificationApprovedEvent,
          creator-certification-rejected:kr.magicbox.notification.adapter.in.kafka.event.CreatorCertificationRejectedEvent,
          creator-revoked:kr.magicbox.notification.adapter.in.kafka.event.CreatorRevokedEvent,
          creator-unbanned:kr.magicbox.notification.adapter.in.kafka.event.CreatorUnbannedEvent,
          release-created:kr.magicbox.notification.adapter.in.kafka.event.ReleaseCreatedEvent,
          release-updated:kr.magicbox.notification.adapter.in.kafka.event.ReleaseUpdatedEvent,
          stock-reserve-succeeded:kr.magicbox.notification.adapter.in.kafka.event.StockReserveSucceededEvent,
          stock-reserve-failed:kr.magicbox.notification.adapter.in.kafka.event.StockReserveFailedEvent,
          order-prepare:kr.magicbox.notification.adapter.in.kafka.event.OrderPrepareEvent,
          order-confirmed:kr.magicbox.notification.adapter.in.kafka.event.OrderConfirmedEvent,
          order-delivered:kr.magicbox.notification.adapter.in.kafka.event.OrderDeliveredEvent,
          order-cancel:kr.magicbox.notification.adapter.in.kafka.event.OrderCancelEvent,
          order-purchase-confirmed:kr.magicbox.notification.adapter.in.kafka.event.OrderPurchaseConfirmedEvent,
          order-auto-confirmed:kr.magicbox.notification.adapter.in.kafka.event.OrderAutoConfirmedEvent,
          payment-succeeded:kr.magicbox.notification.adapter.in.kafka.event.PaymentSucceededEvent,
          payment-failed:kr.magicbox.notification.adapter.in.kafka.event.PaymentFailedEvent,
          payment-cancel-succeeded:kr.magicbox.notification.adapter.in.kafka.event.PaymentCancelSucceededEvent,
          payment-cancel-failed:kr.magicbox.notification.adapter.in.kafka.event.PaymentCancelFailedEvent,
          delivery-started:kr.magicbox.notification.adapter.in.kafka.event.DeliveryStartedEvent,
          delivery-completed:kr.magicbox.notification.adapter.in.kafka.event.DeliveryCompletedEvent,
          general-goods-created:kr.magicbox.notification.adapter.in.kafka.event.GeneralGoodsCreatedEvent,
          general-goods-updated:kr.magicbox.notification.adapter.in.kafka.event.GeneralGoodsUpdatedEvent
    retry:
      topic:
        backoff:
          multiplier: 2
          delay: 1s
        attempts: 5
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT}

inbox:
  max-event-age-minutes: 5

fcm:
  service-account-json: ${FCM_SERVICE_ACCOUNT_JSON}
